services:
  postgres:
    image: postgres:18
    container_name: mmr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mmr_tracker
      POSTGRES_USER: mmr_user
      POSTGRES_PASSWORD: mmr_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
